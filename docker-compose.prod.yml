services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554" # RTSP port
      - "8889:8889" # Mediamtx API port
      - "8189:8189/udp" # WebRTC port
      - "8189:8189/tcp" # WebRTC port

  server-a:
    build: 
      context: ./server-a
      target: prod
    depends_on:
      - mediamtx
    # Override environment variables for production as needed
    # environment:
    #   - JWT_SECRET=mysecret # Must be the same as in server-b
    #   - GRPC_PORT=50051
    #   - MEDIAMTX_API_URL=http://mediamtx:8889
    #   - MEDIAMTX_WEBRTC_URL=http://mediamtx:8189
    #   - MEDIAMTX_USER=admin
    #   - MEDIAMTX_PASSWORD=admin123
    #   - MEDIAMTX_STREAM_PATH=camera
    volumes: !reset []

  server-b:
    build: 
      context: ./server-b
      target: prod
    depends_on:
      - server-a
    # Override environment variables for production as needed
    # environment:
    #   - FRONTEND_ORIGIN=http://localhost
    #   - JWT_SECRET=mysecret # Must be the same as in server-a
    #   - STREAM_TOKEN_PRIVATE_KEY=
    #   - SERVER_A_GRPC_URL=server-a:50051
    volumes: !reset []
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      target: prod
    depends_on:
      - server-a
      - server-b
    volumes: !reset []
    ports:
      - "80:3000"
